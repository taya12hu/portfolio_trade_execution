name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
          POSTGRES_DB: trade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trade -d trade" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, engine, adapter and API tests (SQLite)
        run: pytest
      - name: Engine and API tests against PostgreSQL (partial unique index, concurrency)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://trade:trade@localhost:5432/trade
        run: pytest tests/engine tests/api
      - name: Docker image builds
        run: docker build -t portfolio-trade-execution .
